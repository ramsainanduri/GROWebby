name: Docker Image Publish

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]

env:
  DOCKER_HUB_USERNAME: ramsainanduri

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - service: gromacs-cpu-engine
            context: ./docker/gromacs-cpu
            dockerfile: ./docker/gromacs-cpu/Dockerfile
          - service: gromacs-cuda-engine
            context: ./docker/gromacs
            dockerfile: ./docker/gromacs/Dockerfile
          # Exclude metal build on Ubuntu runners as they usually cross-compile or run macOS natively.
          # If we want to build metal on ubuntu we could, but it might fail without macOS headers.
          # - service: gromacs-metal-engine
          #   context: ./docker/gromacs-metal
          #   dockerfile: ./docker/gromacs-metal/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_HUB_USERNAME }}/growebby-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
