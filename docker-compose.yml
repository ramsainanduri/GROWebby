services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      DJANGO_CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      GROMACS_WORK_ROOT: "/app/media/workspaces"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend-media:/app/media

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: "http://localhost:8000/api"
      VITE_BACKEND_PROXY_TARGET: "http://backend:8000"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

  gromacs-cuda-engine:
    build:
      context: ./docker/gromacs
    platform: linux/amd64
    profiles: ["cuda"]
    command: ["bash", "-lc", "gmx --version && tail -f /dev/null"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
    volumes:
      - backend-media:/work

  gromacs-cpu-engine:
    build:
      context: ./docker/gromacs-cpu
    profiles: ["cpu"]
    command: ["bash", "-lc", "gmx --version && tail -f /dev/null"]
    volumes:
      - backend-media:/work

  gromacs-metal-engine:
    build:
      context: ./docker/gromacs-metal
    profiles: ["metal"]
    command: ["bash", "-lc", "gmx --version && tail -f /dev/null"]
    volumes:
      - backend-media:/work

volumes:
  backend-media:
  frontend-node-modules:
