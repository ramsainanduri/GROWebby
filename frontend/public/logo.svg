<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="boxEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Box (Back faces of the simulation box) -->
  <path d="M 50,15 L 80,30 L 50,45 L 20,30 Z" fill="url(#boxEdge)" opacity="0.1"/>
  <path d="M 50,45 L 80,30 L 80,65 L 50,80 Z" fill="url(#boxEdge)" opacity="0.1"/>
  <path d="M 20,30 L 50,45 L 50,80 L 20,65 Z" fill="url(#boxEdge)" opacity="0.1"/>

  <!-- Back wireframes -->
  <polyline points="50,15 50,45 50,80" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" stroke-dasharray="2,2"/>
  <line x1="50" y1="45" x2="80" y2="30" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" stroke-dasharray="2,2"/>
  <line x1="50" y1="45" x2="20" y2="30" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" stroke-dasharray="2,2"/>

  <!-- Intermolecular Bonds (inside the box) -->
  <line x1="50" y1="35" x2="65" y2="55" stroke="#94a3b8" stroke-width="2.5" />
  <line x1="50" y1="35" x2="35" y2="55" stroke="#94a3b8" stroke-width="2.5" />
  <line x1="65" y1="55" x2="45" y2="65" stroke="#94a3b8" stroke-width="2.5" />
  <line x1="35" y1="55" x2="45" y2="65" stroke="#94a3b8" stroke-width="2.5" />

  <!-- Atoms -->
  <circle cx="50" cy="35" r="7" fill="url(#oceanGrad)" filter="url(#glow)"/>
  <circle cx="65" cy="55" r="5" fill="url(#mintGrad)"/>
  <circle cx="35" cy="55" r="5" fill="url(#mintGrad)"/>
  <circle cx="45" cy="65" r="6" fill="url(#oceanGrad)"/>

  <!-- Atom Highlights for 3D effect -->
  <circle cx="48" cy="33" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="64" cy="54" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="34" cy="54" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="44" cy="64" r="1.5" fill="#ffffff" opacity="0.6"/>

  <!-- Front Box Wireframes (Solid) -->
  <line x1="50" y1="15" x2="80" y2="30" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="30" x2="80" y2="65" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="65" x2="50" y2="80" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="80" x2="20" y2="65" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/>
  <line x1="20" y1="65" x2="20" y2="30" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/>
  <line x1="20" y1="30" x2="50" y2="15" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Digital Nodes on the Box corners to represent the "Web/IT" aspect -->
  <circle cx="50" cy="15" r="2.5" fill="#0284c7" />
  <circle cx="80" cy="30" r="2.5" fill="#0284c7" />
  <circle cx="80" cy="65" r="2.5" fill="#0284c7" />
  <circle cx="50" cy="80" r="2.5" fill="#0284c7" />
  <circle cx="20" cy="65" r="2.5" fill="#0284c7" />
  <circle cx="20" cy="30" r="2.5" fill="#0284c7" />

</svg>
